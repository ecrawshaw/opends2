# Generate the Xcode project with: xcodegen   (brew install xcodegen)
name: KLineiOS
options:
  bundleIdPrefix: io.github.ecrawshaw
  deploymentTarget:
    iOS: "17.0"
packages:
  KLine:
    path: ../KLine
targets:
  KLineApp:
    type: application
    platform: iOS
    sources: [KLineApp]
    dependencies:
      - package: KLine
        product: KLine
    settings:
      base:
        PRODUCT_NAME: KLineApp
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ecrawshaw.kline
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: KLineApp/Info.plist
      properties:
        CFBundleDisplayName: KLine
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: KLine talks to your WiFi OBD adapter on the local network.
        NSBonjourServices: [_kline._tcp, _slcan._tcp, _http._tcp]
        # The adapter's settings page is plain HTTP on the local network
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
