; WiFi OBD adapter (K-line + CAN). Build: pio run -e c3   (or -e esp32dev). Flash: pio run -e c3 -t upload
[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200

; ESP32-C3 SuperMini (default). K TX=GPIO4, K RX=GPIO5, CAN TX=GPIO6, CAN RX=GPIO7, battery=GPIO1, LED=GPIO8 (active low)
[env:c3]
board = esp32-c3-devkitm-1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
  -DK_TX=4 -DK_RX=5 -DCAN_TX=6 -DCAN_RX=7 -DBATT_PIN=1 -DLED_PIN=8 -DLED_ON=LOW

; Classic ESP32 DevKit. K TX=GPIO17, K RX=GPIO16, CAN TX=GPIO21, CAN RX=GPIO22, battery=GPIO34, LED=GPIO2
[env:esp32dev]
board = esp32dev
build_flags = -DK_TX=17 -DK_RX=16 -DCAN_TX=21 -DCAN_RX=22 -DBATT_PIN=34 -DLED_PIN=2 -DLED_ON=HIGH
